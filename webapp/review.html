<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Review</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary: #FF5722; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px 16px 40px;
            background: #fafafa;
            color: #222;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 { font-size: 1.25rem; color: var(--primary); margin-bottom: 8px; }
        .sub { color: #666; font-size: 0.9rem; margin-bottom: 18px; }
        .stars { display: flex; gap: 8px; margin-bottom: 16px; }
        .star {
            font-size: 2rem;
            cursor: pointer;
            color: #ddd;
            line-height: 1;
            user-select: none;
        }
        .star.on { color: #FFB300; }
        textarea {
            width: 100%;
            min-height: 110px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 12px;
        }
        .photo-row { margin-bottom: 16px; }
        .photo-row input { width: 100%; }
        .preview {
            margin-top: 10px;
            max-width: 100%;
            max-height: 180px;
            border-radius: 10px;
            display: none;
        }
        .submit {
            width: 100%;
            border: none;
            background: var(--primary);
            color: #fff;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .submit:disabled { opacity: 0.6; cursor: default; }
        .msg { margin-top: 12px; font-size: 0.9rem; min-height: 1.2em; }
        .msg.ok { color: #2e7d32; }
        .msg.err { color: #c62828; }
        .lang-bar { display: flex; gap: 8px; margin-bottom: 14px; }
        .lang-btn {
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
        }
        .lang-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    </style>
</head>
<body>
    <div class="lang-bar">
        <button class="lang-btn" data-lang="en" type="button">EN</button>
        <button class="lang-btn" data-lang="km" type="button">KM</button>
        <button class="lang-btn" data-lang="zh" type="button">中文</button>
    </div>
    <div class="card">
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
        <div class="stars" id="stars"></div>
        <textarea id="comment"></textarea>
        <div class="photo-row">
            <label id="photoLabel"></label>
            <input type="file" id="photo" accept="image/*">
            <img class="preview" id="preview" alt="">
        </div>
        <button class="submit" id="submitBtn" type="button"></button>
        <div class="msg" id="msg"></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const translations = {
            en: {
                title: "Rate your meal",
                subtitle: "Earn 5 points (+10 with a photo)",
                comment_ph: "Tell us about your experience...",
                photo: "Optional photo",
                submit: "Submit Review",
                submitting: "Submitting...",
                success: "Thanks! Points added. You can close this page.",
                need_rating: "Please select a star rating",
                need_user: "Open this page from Telegram",
                failed: "Could not submit review",
                already: "You already reviewed this order",
            },
            km: {
                title: "Rate your meal",
                subtitle: "Earn 5 points (+10 with a photo)",
                comment_ph: "Tell us about your experience...",
                photo: "Optional photo",
                submit: "Submit Review",
                submitting: "Submitting...",
                success: "Thanks! Points added. You can close this page.",
                need_rating: "Please select a star rating",
                need_user: "Open this page from Telegram",
                failed: "Could not submit review",
                already: "You already reviewed this order",
            },
            zh: {
                title: "为餐点评分",
                subtitle: "评价得 5 积分（附照片 +10）",
                comment_ph: "分享你的用餐体验...",
                photo: "可选照片",
                submit: "提交评价",
                submitting: "提交中...",
                success: "谢谢！积分已到账，可以关闭页面。",
                need_rating: "请先选择星级",
                need_user: "请从 Telegram 打开此页",
                failed: "提交失败",
                already: "你已评价过此订单",
            },
        };

        let currentLang = "en";
        let rating = 0;
        const params = new URLSearchParams(window.location.search);
        const orderId = parseInt(params.get("order_id") || "0", 10);

        function t(key) {
            return translations[currentLang]?.[key] ?? translations.en[key] ?? key;
        }

        function detectLang() {
            const saved = localStorage.getItem("lang");
            if (saved && translations[saved]) return saved;
            const code = (tg?.initDataUnsafe?.user?.language_code || "").toLowerCase();
            if (code.startsWith("km")) return "km";
            if (code.startsWith("zh")) return "zh";
            return "en";
        }

        function renderStars() {
            const box = document.getElementById("stars");
            box.innerHTML = "";
            for (let i = 1; i <= 5; i++) {
                const s = document.createElement("span");
                s.className = "star" + (i <= rating ? " on" : "");
                s.textContent = "★";
                s.addEventListener("click", () => {
                    rating = i;
                    renderStars();
                });
                box.appendChild(s);
            }
        }

        function render() {
            document.querySelectorAll(".lang-btn").forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.lang === currentLang);
            });
            document.getElementById("title").textContent = t("title");
            document.getElementById("subtitle").textContent = t("subtitle");
            document.getElementById("comment").placeholder = t("comment_ph");
            document.getElementById("photoLabel").textContent = t("photo");
            document.getElementById("submitBtn").textContent = t("submit");
            renderStars();
        }

        document.getElementById("photo").addEventListener("change", (e) => {
            const file = e.target.files?.[0];
            const preview = document.getElementById("preview");
            if (!file) {
                preview.style.display = "none";
                return;
            }
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        });

        document.querySelectorAll(".lang-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                currentLang = btn.dataset.lang;
                localStorage.setItem("lang", currentLang);
                render();
            });
        });

        document.getElementById("submitBtn").addEventListener("click", async () => {
            const msg = document.getElementById("msg");
            const btn = document.getElementById("submitBtn");
            const user = tg?.initDataUnsafe?.user;
            if (!orderId) {
                msg.textContent = t("failed");
                msg.className = "msg err";
                return;
            }
            if (!rating) {
                msg.textContent = t("need_rating");
                msg.className = "msg err";
                return;
            }
            if (!user?.id) {
                msg.textContent = t("need_user");
                msg.className = "msg err";
                return;
            }

            btn.disabled = true;
            btn.textContent = t("submitting");
            const form = new FormData();
            form.append("order_id", String(orderId));
            form.append("rating", String(rating));
            form.append("comment", document.getElementById("comment").value || "");
            form.append("user_id", String(user.id));
            form.append("first_name", user.first_name || "");
            const file = document.getElementById("photo").files?.[0];
            if (file) form.append("image", file);

            try {
                const res = await fetch("/api/review", { method: "POST", body: form });
                const data = await res.json();
                if (!res.ok || !data.ok) {
                    if (data.error === "already_reviewed") {
                        msg.textContent = t("already");
                    } else {
                        msg.textContent = t("failed");
                    }
                    msg.className = "msg err";
                    btn.disabled = false;
                    btn.textContent = t("submit");
                    return;
                }
                msg.textContent = t("success") + ` (+${data.points_awarded})`;
                msg.className = "msg ok";
                if (tg?.showAlert) {
                    tg.showAlert(t("success"));
                }
                setTimeout(() => {
                    if (tg?.close) tg.close();
                }, 1200);
            } catch (err) {
                console.error(err);
                msg.textContent = t("failed");
                msg.className = "msg err";
                btn.disabled = false;
                btn.textContent = t("submit");
            }
        });

        currentLang = detectLang();
        render();
    </script>
</body>
</html>
